<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>খবর | রাজনৈতিক বার্তা</title>
<meta name="description" content="রাজনৈতিক বার্তার বিস্তারিত সংবাদ">
<meta name="theme-color" content="#087f3f">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,"Noto Sans Bengali","SolaimanLipi",sans-serif;
  background:#f3f5f7;color:#222;line-height:1.8
}
button{font:inherit;cursor:pointer}
.topbar{
  background:#087f3f;color:#fff;position:sticky;top:0;z-index:10;
  box-shadow:0 2px 8px rgba(0,0,0,.15)
}
.topbar-inner{
  max-width:1000px;margin:auto;padding:13px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:15px
}
.brand{font-size:24px;font-weight:800}
.back-btn{
  border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;
  border-radius:7px;padding:7px 12px
}
.back-btn:hover{background:rgba(255,255,255,.12)}
.article-wrap{max-width:900px;margin:25px auto;padding:0 18px 50px}
.article-card{
  background:#fff;border-radius:12px;overflow:hidden;
  box-shadow:0 3px 15px rgba(0,0,0,.08)
}
.article-hero{
  min-height:300px;padding:35px 25px;display:flex;align-items:center;
  justify-content:center;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#087f3f,#0b5e34 55%,#183d2a);color:#fff
}
.article-hero:before{
  content:"";position:absolute;width:330px;height:330px;border-radius:50%;
  border:45px solid rgba(255,255,255,.08);right:-90px;top:-120px
}
.article-hero:after{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.06);left:-90px;bottom:-110px
}
.hero-icon{position:relative;z-index:1;font-size:95px}
.hero-image{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2
}
.hero-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:3
}
.article-body{padding:30px}
.category{
  display:inline-block;color:#087f3f;font-weight:800;font-size:14px;
  margin-bottom:8px
}
h1{font-size:38px;line-height:1.4;margin-bottom:12px}
.meta{
  color:#777;font-size:14px;border-bottom:1px solid #eee;
  padding-bottom:18px;margin-bottom:22px
}
.author{font-weight:bold;color:#444}
.article-text{font-size:18px;color:#333;white-space:pre-line}
.article-text p{margin-bottom:18px}
.share-row{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  border-top:1px solid #eee;margin-top:28px;padding-top:20px
}
.share-row span{font-weight:bold;margin-right:5px}
.share-btn{
  border:0;border-radius:7px;padding:8px 13px;color:#fff
}
.facebook{background:#1877f2}.whatsapp{background:#20b15a}
.copy{background:#555}
.related{
  margin-top:25px;background:#fff;padding:22px;border-radius:10px;
  box-shadow:0 2px 9px rgba(0,0,0,.07)
}
.related h2{font-size:21px;margin-bottom:8px;color:#087f3f}
footer{
  background:#111;color:#fff;text-align:center;padding:28px 18px
}
footer h2{color:#35b76b;margin-bottom:7px}
.status{text-align:center;color:#777;padding:40px}
@media(max-width:600px){
  .topbar-inner{padding:11px 12px}.brand{font-size:20px}
  .article-wrap{margin:12px auto;padding:0 10px 35px}
  .article-hero{min-height:220px}.hero-icon{font-size:70px}
  .article-body{padding:22px 17px}
  h1{font-size:27px;line-height:1.45}
  .article-text{font-size:17px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">রাজনৈতিক বার্তা</div>
    <button class="back-btn" onclick="location.href='./index.html'">← ফিরে যান</button>
  </div>
</header>

<main class="article-wrap">
  <article class="article-card" id="articleCard">
    <div class="article-hero" id="hero">
      <div class="hero-icon" id="heroIcon">📰</div>
    </div>

    <div class="article-body">
      <div class="category" id="category">সংবাদ</div>
      <h1 id="title">খবর</h1>
      <div class="meta">
        <span id="date"></span>
        <span> · </span>
        <span class="author">রাজনৈতিক বার্তা ডেস্ক</span>
        <span> · </span>
        <span>পাঠ সময়: ২ মিনিট</span>
      </div>

      <div class="article-text" id="articleText"></div>

      <div class="share-row">
        <span>শেয়ার করুন:</span>
        <button class="share-btn facebook" id="facebookShare">Facebook</button>
        <button class="share-btn whatsapp" id="whatsappShare">WhatsApp</button>
        <button class="share-btn copy" id="copyShare">লিংক কপি</button>
      </div>
    </div>
  </article>

  <section class="related">
    <h2>রাজনৈতিক বার্তা</h2>
    <p>বাংলাদেশের রাজনৈতিক খবর ও সংবাদ নিয়মিত পেতে মূল পাতায় ফিরে আরও খবর দেখুন।</p>
    <br>
    <button class="back-btn" style="background:#087f3f;border-color:#087f3f" onclick="location.href='index.html'">
      সব খবর দেখুন
    </button>
  </section>
</main>

<footer>
  <h2>রাজনৈতিক বার্তা</h2>
  <p>বাংলাদেশের রাজনৈতিক খবর ও সংবাদ</p>
  <br>
  <p>© ২০২৬ রাজনৈতিক বার্তা — সর্বস্বত্ব সংরক্ষিত</p>
</footer>

<script>
(function(){
  const params=new URLSearchParams(location.search);
  let saved=null;

  try{
    saved=JSON.parse(localStorage.getItem("selectedPoliticalNews")||"null");
  }catch(e){}

  const category=params.get("category")||saved?.category||"সংবাদ";
  const title=params.get("title")||saved?.title||"খবর";
  const date=params.get("date")||saved?.date||"";
  const summary=params.get("summary")||"";
  const content=(saved?.title===title && saved?.content) ? saved.content : (summary||"এই সংবাদের বিস্তারিত তথ্য শিগগিরই প্রকাশ করা হবে।");
  const icon=params.get("icon")||saved?.icon||"📰";
  const image=(saved?.title===title && saved?.image) ? saved.image : "";

  document.getElementById("category").textContent=category;
  document.getElementById("title").textContent=title;
  document.getElementById("date").textContent=date;
  document.getElementById("heroIcon").textContent=icon;
  document.title=title+" | রাজনৈতিক বার্তা";

  const text=document.getElementById("articleText");
  text.innerHTML="";

  String(content).split(/\n+/).filter(Boolean).forEach(function(line){
    const p=document.createElement("p");
    p.textContent=line;
    text.appendChild(p);
  });

  if(image){
    const img=document.createElement("img");
    img.className="hero-image";
    img.src=image;
    img.alt=title;
    img.onerror=function(){img.remove()};
    document.getElementById("hero").appendChild(img);

    const overlay=document.createElement("div");
    overlay.className="hero-overlay";
    document.getElementById("hero").appendChild(overlay);
  }

  const url=location.href;
  document.getElementById("facebookShare").onclick=function(){
    window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(url),"_blank","noopener,noreferrer");
  };
  document.getElementById("whatsappShare").onclick=function(){
    window.open("https://wa.me/?text="+encodeURIComponent(title+" — "+url),"_blank","noopener,noreferrer");
  };
  document.getElementById("copyShare").onclick=async function(){
    try{
      await navigator.clipboard.writeText(url);
      this.textContent="কপি হয়েছে ✓";
      setTimeout(()=>this.textContent="লিংক কপি",1800);
    }catch(e){
      alert("লিংক কপি করা যায়নি।");
    }
  };
})();
</script>
</body>
</html>
